<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Susun Foto KTP ke Word</title>

<!-- Logo tab browser: taruh file favicon.png di folder yang sama dengan index.html -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: Arial, sans-serif;
    background: #fff;
  }

  #appFrame {
    border: none;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: block;
  }

  /* Tombol cadangan di pojok kanan bawah (desktop) */
  #fallbackMsg {
    display: none;
    position: fixed;
    right: 12px;
    bottom: 12px;
    z-index: 10;
  }

  .btn {
    display: inline-block;
    padding: 10px 16px;
    background: #0f766e;
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .btn:hover { background: #115e59; }

  /* Pesan untuk HP saat pengalihan */
  #mobileMsg {
    display: none;
    padding: 40px 20px;
    text-align: center;
    color: #444;
  }
</style>
</head>
<body>

<iframe id="appFrame" allow="clipboard-write"></iframe>

<div id="fallbackMsg">
  <a class="btn" id="fallbackLink" target="_blank" rel="noopener">🚀 Buka di tab baru</a>
</div>

<div id="mobileMsg">
  Membuka aplikasi...<br><br>
  <a class="btn" id="mobileLink">🚀 Klik di sini jika tidak terbuka</a>
</div>

<script>
// Satu-satunya tempat yang perlu diganti saat link Apps Script berubah
const APP_URL = "https://script.google.com/macros/s/AKfycbyAAqgZhHbjZ3hK0SPqQkD-raWQc3Qq93OQcVDWsffWP5AQ_MmEGHAXSI0hyCJjiv79/exec";

const frame     = document.getElementById('appFrame');
const fallback  = document.getElementById('fallbackMsg');
const mobileMsg = document.getElementById('mobileMsg');

document.getElementById('fallbackLink').href = APP_URL;
document.getElementById('mobileLink').href   = APP_URL;

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

if (isMobile) {
  // HP: buka langsung tanpa iframe (menghindari layar putih)
  frame.style.display = 'none';
  mobileMsg.style.display = 'block';
  window.location.replace(APP_URL);
} else {
  // Desktop: tampil lewat iframe, tombol cadangan selalu tersedia
  frame.src = APP_URL;
  fallback.style.display = 'block';
}
</script>

</body>
</html>
