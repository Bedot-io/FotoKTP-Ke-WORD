<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Susun Foto KTP ke Word</title>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: Arial, sans-serif;
  }

  body {
    background: #fff;
  }

  #appFrame {
    border: none;
    width: 100%;
    height: 100vh;
    display: block;
  }

  /* Pesan jika iframe gagal dimuat (mis. diblokir oleh Google) */
  #fallbackMsg {
    display: none;
    padding: 30px;
    text-align: center;
    color: #444;
  }

  .btn {
    display: inline-block;
    padding: 12px 20px;
    background: #0f766e;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
  }

  .btn:hover { background: #115e59; }
</style>
</head>
<body>

<iframe id="appFrame" allow="clipboard-write"></iframe>

<div id="fallbackMsg">
  Aplikasi tidak bisa ditampilkan langsung di halaman ini.<br><br>
  <a class="btn" id="fallbackLink" target="_blank">🚀 Buka di tab baru</a>
</div>

<script>
  // Satu-satunya tempat yang perlu diganti saat link Apps Script berubah
  const APP_URL = "https://script.google.com/macros/s/AKfycbzUmZbw4wi9skcTG8UgDyQXjjdtUWXmw2nXALrRG1hBcLLz3WlxVZ_xEpQ92-4O5ZvfhA/exec";

  const frame = document.getElementById('appFrame');
  frame.src = APP_URL;
  document.getElementById('fallbackLink').href = APP_URL;
</script>

</body>
</html>
