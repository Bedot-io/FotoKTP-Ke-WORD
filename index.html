<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Susun Foto KTP ke Word</title>

<!-- Logo tab browser: taruh file favicon.png di folder yang sama dengan index.html -->
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #fff;
    overflow: hidden;
  }

  #appFrame {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>
<body>

<iframe id="appFrame" allow="clipboard-write; clipboard-read; fullscreen" title="Susun Foto KTP ke Word"></iframe>

<script>
// Satu-satunya tempat yang perlu diganti saat link Apps Script berubah
const APP_URL = "https://script.google.com/macros/s/AKfycbwVzexqqSr514b9DaxHEKwGlFo8mi7xLziThTgtD646V-aw2LmX9SSZroz2-7KMCK6EIQ/exec";

document.getElementById('appFrame').src = APP_URL;
</script>

</body>
</html>
